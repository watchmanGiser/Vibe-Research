# 浏览器请求通过同源检查后，反代才可以归一化 Origin 并附加内部令牌。
map $http_origin $vra_browser_origin_allowed {
    default 0;
    "" 1;
    "https://soufly.cn" 1;
}
map $http_sec_fetch_site $vra_browser_site_allowed {
    default 1;
    "cross-site" 0;
}

# 公开钉钉页的匿名访客不触发其他私有接口的浏览器密码弹窗。
# 此标记只拒绝辅助请求，不放开通用 API 或注入额外权限。
map "$http_referer|$http_authorization" $vra_dingtalk_public_visitor {
    default 0;
    ~^https://soufly\.cn/vibe-research/intel/dingtalk(?:\?[^|]*)?\|$ 1;
    ~^https://soufly\.cn/dingtalk/?(?:\?[^|]*)?\|$ 1;
}
