# Vibe-Research 后端 Docker 编排（部署到 T480）
#
# 本机（Windows）只跑前端 Vite dev server，/api 代理到这个后端。
# 数据源（腾讯行情 / 东财研报/公告）默认直连，T480 无需额外代理。
#
# 用法：
#   docker compose up -d                 # 启动后端 :8900
#   docker compose logs -f --tail=50     # 跟日志
#   docker compose down                  # 停止（保留数据卷）
#
# 环境变量（可写同目录 .env 覆盖默认值）：
#   APP_PORT            — 主机端口，默认 8900
#   VR_API_KEY          — API 鉴权 key（公网部署必设）
#   VR_ALLOW_ORIGINS    — CORS 白名单（默认开放）
#   VR_DATA_PROXY=1     — 东财数据走系统代理（仅当 T480 必须靠代理出网时）

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "${APP_PORT:-8900}:8900"
    environment:
      - VR_ALLOW_ORIGINS=${VR_ALLOW_ORIGINS:-*}
      - VR_API_KEY=${VR_API_KEY:-}
      - VR_DATA_PROXY=${VR_DATA_PROXY:-0}
    volumes:
      # 用户数据持久化（持仓 / 关注股 / 研报）
      - ~/.vibe-research:/root/.vibe-research
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
