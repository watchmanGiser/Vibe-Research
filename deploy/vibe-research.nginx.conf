# 独立入口与工作台页共用消息来源，不经过工作台初始化或重定向。
location = /dingtalk {
    auth_basic off;
    return 301 /dingtalk/$is_args$args;
}

location = /dingtalk/ {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/dingtalk.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location = /vibe-research {
    return 301 /vibe-research/;
}

# 公共探针只暴露服务状态和版本。
location = /vibe-research/api/health {
    auth_basic off;
    proxy_pass http://127.0.0.1:8092/health;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# 用户指定此页公开；直接提供 SPA 入口，避免回落到受保护的 index 路由。
location = /vibe-research/intel/dingtalk {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location = /vibe-research/intel/dingtalk/ {
    auth_basic off;
    return 301 /vibe-research/intel/dingtalk$is_args$args;
}

# 前端资源只有程序与样式，业务数据仍由各自接口控制访问。
location ^~ /vibe-research/assets/ {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/assets/;
    add_header Cache-Control "no-cache" always;
}

location ^~ /vibe-research/semi-assets/ {
    auth_basic "Vibe Research";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-research;
    alias /opt/vibe-research/shared/semi/assets/;
    add_header Cache-Control "private, no-cache" always;
}

# 原文与总结公开只读；内部令牌仍由反代注入，浏览器不持有凭据。
location = /vibe-research/api/semi/dingtalk {
    if ($vra_browser_origin_allowed = 0) { return 403; }
    if ($vra_browser_site_allowed = 0) { return 403; }
    auth_basic off;
    proxy_pass http://127.0.0.1:8092/semi/dingtalk;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store" always;
}

location ^~ /vibe-research/api/ {
    if ($vra_dingtalk_public_visitor = 1) { return 403; }
    if ($vra_browser_origin_allowed = 0) { return 403; }
    if ($vra_browser_site_allowed = 0) { return 403; }
    auth_basic "Vibe Research";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-research;
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 25m;
}

location ^~ /vibe-research/ {
    auth_basic "Vibe Research";
    auth_basic_user_file /etc/nginx/.htpasswd-vibe-research;
    alias /opt/vibe-research/app/desktop/dist/;
    try_files $uri $uri/ /vibe-research/index.html;
    add_header Cache-Control "no-cache";
}
