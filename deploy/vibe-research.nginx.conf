location = /vibe-research {
    return 301 /vibe-research/;
}

location ^~ /vibe-research/api/ {
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 25m;
}

location ^~ /vibe-research/ {
    alias /opt/vibe-research/app/desktop/dist/;
    try_files $uri $uri/ /vibe-research/index.html;
    add_header Cache-Control "no-cache";
}
