# 独立入口与工作台页共用消息来源，不经过工作台初始化或重定向。
location = /dingtalk {
    auth_basic off;
    return 301 /dingtalk/$is_args$args;
}

location = /dingtalk/ {
    auth_basic off;
    root /opt/vibe-research/app/desktop/dist;
    try_files /dingtalk.html =404;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

# 原文配图采用内容哈希命名，只公开持久目录中的位图文件。
location ~ "^/dingtalk/media/([a-f0-9]{64}\.(?:jpg|png|gif|webp))$" {
    auth_basic off;
    alias /opt/vibe-research/shared/semi/dingtalk-media/$1;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
}

# 文档缓存只开放校验后的文件名，索引和来源地址不对外提供。
location ~ "^/dingtalk/documents/([a-f0-9]{64}(?:-[a-f0-9]{64})?(?:-preview|-page-[0-9]{3})?\.(?:pdf|docx|doc|txt|jpg))$" {
    auth_basic off;
    alias /opt/vibe-research/shared/semi/dingtalk-documents/$1;
    types {
        application/pdf pdf;
        application/vnd.openxmlformats-officedocument.wordprocessingml.document docx;
        application/msword doc;
        text/plain txt;
        image/jpeg jpg;
    }
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=86400, immutable" always;
}

location /dingtalk/documents/ {
    auth_basic off;
    return 404;
}

location /dingtalk/media/ {
    auth_basic off;
    return 404;
}

location = /vibe-research {
    auth_basic off;
    return 301 /vibe-research/;
}

# 公共探针只暴露服务状态和版本。
location = /vibe-research/api/health {
    auth_basic off;
    proxy_pass http://127.0.0.1:8092/health;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store" always;
}

# 钉钉旧入口继续直接提供 SPA，兼容已有收藏。
location = /vibe-research/intel/dingtalk {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache" always;
}

location = /vibe-research/intel/dingtalk/ {
    auth_basic off;
    return 301 /vibe-research/intel/dingtalk$is_args$args;
}

# 工作台页面、静态资源和配套接口均免登录。
location ^~ /vibe-research/assets/ {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/assets/;
    add_header Cache-Control "no-cache" always;
}

location ^~ /vibe-research/semi-assets/ {
    auth_basic off;
    alias /opt/vibe-research/shared/semi/assets/;
    add_header Cache-Control "private, no-cache" always;
}

# 原文与总结公开只读；内部令牌仍由反代注入，浏览器不持有凭据。
location = /vibe-research/api/semi/dingtalk {
    if ($vra_browser_origin_allowed = 0) { return 403; }
    if ($vra_browser_site_allowed = 0) { return 403; }
    auth_basic off;
    proxy_pass http://127.0.0.1:8092/semi/dingtalk;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header Cache-Control "private, no-store" always;
}

# 接口仍通过同源检查和内部令牌转发，浏览器无需站点密码。
location ^~ /vibe-research/api/ {
    if ($vra_browser_origin_allowed = 0) { return 403; }
    if ($vra_browser_site_allowed = 0) { return 403; }
    auth_basic off;
    proxy_pass http://127.0.0.1:8092/;
    proxy_http_version 1.1;
    include /etc/nginx/snippets/vibe-research-auth.nginx.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Sec-Fetch-Site same-origin;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    client_max_body_size 25m;
}

location ^~ /vibe-research/ {
    auth_basic off;
    alias /opt/vibe-research/app/desktop/dist/;
    try_files $uri $uri/ /vibe-research/index.html;
    add_header Cache-Control "no-cache";
}
