[Service]
# 仅给既有整理服务增加上限，不更改私有环境文件和原文采集服务。
TimeoutStartSec=8min
TimeoutStopSec=10s
KillMode=control-group
Environment=DINGTALK_MAX_RUN_MS=480000
Environment=DINGTALK_MAX_SUMMARIES_PER_RUN=2
Environment=DINGTALK_MAX_JOB_ATTEMPTS=3
Environment=DINGTALK_RETRY_DELAYS_MS=1800000,7200000
Environment=DINGTALK_DAILY_TOKEN_BUDGET=2000000
Environment=DINGTALK_DAILY_CALL_BUDGET=24
